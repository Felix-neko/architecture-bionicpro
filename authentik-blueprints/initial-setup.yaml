# ============================================================================
# Authentik Blueprint: Полная конфигурация без Keycloak
# ============================================================================
# Этот blueprint настраивает Authentik как единственный IdP с:
# 1. Yandex OAuth 2.0 как внешний провайдер
# 2. LDAP Federation (openldap-zambia)
# 3. Предопределенные пользователи с ролями
# 4. Proxy Provider для фронтенда и бэкенда (session-based auth)
# ============================================================================

version: 1
metadata:
  name: BionicPro Complete Setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ============================================================================
  # 1. Создание групп (ролей)
  # ============================================================================
  # Группы в Authentik используются для управления доступом и ролями
  # ============================================================================
  
  - model: authentik_core.group
    id: group-prothetic-users
    identifiers:
      name: prothetic_users
    attrs:
      name: prothetic_users
      # Группа для пользователей с доступом к протезированию
      is_superuser: false
  
  - model: authentik_core.group
    id: group-users
    identifiers:
      name: users
    attrs:
      name: users
      # Базовая группа для всех пользователей
      is_superuser: false

  # ============================================================================
  # 2. Создание предопределенных пользователей
  # ============================================================================
  # Пользователи с паролями и группами (ролями)
  # ============================================================================
  
  - model: authentik_core.user
    id: user-prothetic1
    identifiers:
      username: prothetic1
    attrs:
      username: prothetic1
      name: Prothetic User 1
      email: prothetic1@example.com
      # Пароль: prothetic123 (хешируется автоматически)
      password: "prothetic123"
      is_active: true
      # Добавляем пользователя в группы
      groups:
        - !KeyOf group-prothetic-users
        - !KeyOf group-users
      attributes:
        first_name: Prothetic
        last_name: User1
  
  - model: authentik_core.user
    id: user-prothetic2
    identifiers:
      username: prothetic2
    attrs:
      username: prothetic2
      name: Prothetic User 2
      email: prothetic2@example.com
      password: "prothetic123"
      is_active: true
      groups:
        - !KeyOf group-prothetic-users
        - !KeyOf group-users
      attributes:
        first_name: Prothetic
        last_name: User2

  # ============================================================================
  # 3. LDAP Source для User Federation (openldap-zambia)
  # ============================================================================
  # Подключение к внешнему LDAP серверу для синхронизации пользователей
  # ============================================================================
  
  - model: authentik_sources_ldap.ldapsource
    id: ldap-zambia-source
    identifiers:
      slug: ldap-zambia
    attrs:
      name: LDAP Zambia
      slug: ldap-zambia
      enabled: true
      
      # Настройки подключения к LDAP серверу
      server_uri: ldap://openldap-zambia:389
      bind_cn: cn=admin,dc=zambia,dc=local
      bind_password: admin123
      
      # Base DN для поиска пользователей
      base_dn: dc=zambia,dc=local
      
      # Дополнительные настройки
      start_tls: false
      sni: false
      
      # Синхронизация пользователей и групп
      sync_users: true
      sync_users_password: true
      sync_groups: true
      
      # Маппинг атрибутов LDAP -> Authentik
      # Пользователи в LDAP будут автоматически создаваться в Authentik
      object_uniqueness_field: uid
      user_object_filter: "(objectClass=inetOrgPerson)"
      group_object_filter: "(objectClass=groupOfNames)"
      
      # Property mappings для LDAP атрибутов (используем встроенные)
      property_mappings: []

  # ============================================================================
  # 4. Yandex OAuth 2.0 Source
  # ============================================================================
  # Подключение Яндекса как внешнего OAuth провайдера
  # ============================================================================
  
  - model: authentik_sources_oauth.oauthsource
    id: yandex-oauth-source
    identifiers:
      slug: yandex
    attrs:
      name: Yandex
      slug: yandex
      enabled: true
      
      # Тип провайдера - OpenID Connect (Yandex поддерживает OIDC)
      provider_type: openidconnect
      
      # OAuth endpoints для Яндекса
      authorization_url: https://oauth.yandex.ru/authorize
      access_token_url: https://oauth.yandex.ru/token
      profile_url: https://login.yandex.ru/info
      
      # OIDC configuration URL (Yandex поддерживает discovery)
      oidc_well_known_url: https://login.yandex.ru/.well-known/openid-configuration
      oidc_jwks_url: https://login.yandex.ru/jwks
      
      # Client credentials (нужно получить в Яндекс OAuth)
      # ВАЖНО: Замените на реальные значения!
      consumer_key: "YOUR_YANDEX_CLIENT_ID"
      consumer_secret: "YOUR_YANDEX_CLIENT_SECRET"
      
      # Scopes для запроса у Яндекса
      additional_scopes: "login:email login:info"
      
      # Маппинг пользователей из Яндекса
      user_matching_mode: email_link
      
      # Автоматическое создание пользователей
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]

  # ============================================================================
  # 5. Custom Property Mappings для JWT токенов
  # ============================================================================
  # Определяем, какие данные включать в JWT токены
  # ============================================================================
  
  # Mapping для ролей (groups)
  - model: authentik_providers_oauth2.scopemapping
    id: custom-roles-mapping
    identifiers:
      name: Custom Roles Mapping
    attrs:
      name: Custom Roles Mapping
      scope_name: roles
      description: "Добавляет роли пользователя в JWT токен"
      expression: |
        # Получаем все группы пользователя
        groups = [group.name for group in user.ak_groups.all()]
        return {
            "roles": groups,
            "resource_access": {
                "bionicpro-frontend": {
                    "roles": groups
                }
            }
        }
  
  # Mapping для username (preferred_username)
  - model: authentik_providers_oauth2.scopemapping
    id: custom-username-mapping
    identifiers:
      name: Custom Username Mapping
    attrs:
      name: Custom Username Mapping
      scope_name: profile
      description: "Добавляет preferred_username в JWT токен"
      expression: |
        return {
            "preferred_username": user.username,
            "username": user.username,
        }
  
  # Mapping для имени и фамилии
  - model: authentik_providers_oauth2.scopemapping
    id: custom-name-mapping
    identifiers:
      name: Custom Name Mapping
    attrs:
      name: Custom Name Mapping
      scope_name: profile
      description: "Добавляет first_name и last_name в JWT токен"
      expression: |
        return {
            "given_name": user.attributes.get("first_name", user.name.split()[0] if user.name else ""),
            "family_name": user.attributes.get("last_name", user.name.split()[-1] if user.name and len(user.name.split()) > 1 else ""),
            "first_name": user.attributes.get("first_name", user.name.split()[0] if user.name else ""),
            "last_name": user.attributes.get("last_name", user.name.split()[-1] if user.name and len(user.name.split()) > 1 else ""),
        }

  # ============================================================================
  # 6. Proxy Provider для фронтенда (Proxy Mode)
  # ============================================================================
  # Proxy Provider проксирует трафик к фронтенду и добавляет заголовки
  # Authentik Proxy Outpost работает как reverse proxy
  # ============================================================================
  
  - model: authentik_providers_proxy.proxyprovider
    id: bionicpro-proxy-provider
    identifiers:
      name: BionicPro Proxy Provider
    attrs:
      name: BionicPro Proxy Provider
      
      # Режим: forward_single - forward auth для одного приложения
      # В этом режиме Traefik проверяет аутентификацию через Authentik
      mode: forward_single
      
      # External host - домен, по которому пользователи заходят (через Traefik)
      external_host: http://localhost:7777
      
      # Internal host SSL validation
      internal_host_ssl_validation: false
      
      # Настройки cookie
      cookie_domain: localhost
      
      # Token validity
      token_validity: hours=24
      
      # Authorization flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      
      # Authentication flow
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      
      # Property mappings для заголовков
      property_mappings:
        - !Find [authentik_providers_proxy.scopemapping, [scope_name, "authentik default OAuth Mapping: Proxy outpost"]]
      
      # Режим перехвата заголовков
      intercept_header_auth: true
      
      # Настройки для basic auth (опционально)
      basic_auth_enabled: false

  # ============================================================================
  # 7. Application для фронтенда
  # ============================================================================
  # Application связывает Provider с политиками доступа
  # ============================================================================
  
  - model: authentik_core.application
    id: bionicpro-app
    identifiers:
      slug: bionicpro-frontend
    attrs:
      name: BionicPro Application
      slug: bionicpro-frontend
      
      # Связь с Proxy Provider
      provider: !KeyOf bionicpro-proxy-provider
      
      # URL для запуска приложения (через Traefik)
      meta_launch_url: http://localhost:7777
      
      # Описание
      meta_description: BionicPro Frontend and Backend Application
      meta_publisher: BionicPro Team
      
      # Режим работы policy engine
      policy_engine_mode: any
  
  # ============================================================================
  # 8. Создаем API Token для автоматизации
  # ============================================================================
  # Создаем токен для скрипта инициализации
  # ============================================================================
  
  # Создаем service account для API с правами superuser
  - model: authentik_core.user
    id: api-service-account
    identifiers:
      username: "api-service-account"
    attrs:
      username: "api-service-account"
      name: "API Service Account"
      is_active: true
      is_superuser: true
      type: service_account
  
  # Создаем токен для service account
  - model: authentik_core.token
    id: api-token
    identifiers:
      identifier: "api-init-token"
    attrs:
      identifier: "api-init-token"
      user: !KeyOf api-service-account
      intent: api
      expiring: false
      # Токен: api-init-token-12345
      key: "api-init-token-12345"
