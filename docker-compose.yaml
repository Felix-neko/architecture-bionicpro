version: '3.8'

services:
  # LDAP сервер для User Federation
  openldap-zambia:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Zambia Company"
      LDAP_DOMAIN: "zambia.local"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: "/seed-ldif"
    volumes:
#      - ./ldap/data:/var/lib/ldap
#      - ./ldap/config:/etc/ldap/slapd.d
      - ./ldap:/seed-ldif
    ports:
      - "389:389"
  # Web UI для управления LDAP
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap-zambia"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - openldap-zambia
  authentik_db:
    image: postgres:14
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik_password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 3s
      retries: 5
  authentik_redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
  authentik_server:
    image: ghcr.io/goauthentik/server:2025.10
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "change-me-to-a-random-string-at-least-50-chars-long-please"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_POSTGRESQL__HOST: authentik_db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_password
      AUTHENTIK_BOOTSTRAP_PASSWORD: Admin123!@#
      AUTHENTIK_BOOTSTRAP_TOKEN: bootstrap-token-change-me
    ports:
      - "9000:9000"
      - "9444:9443"
    depends_on:
      authentik_db:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
      openldap-zambia:
        condition: service_started
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./authentik-blueprints:/blueprints/custom:ro
  authentik_worker:
    image: ghcr.io/goauthentik/server:2025.10
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "change-me-to-a-random-string-at-least-50-chars-long-please"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_POSTGRESQL__HOST: authentik_db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_password
    depends_on:
      authentik_db:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
      openldap-zambia:
        condition: service_started
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./authentik-blueprints:/blueprints/custom:ro
  # Удалено: frontend больше не нужен в docker-compose
  # Фронтенд запускается отдельно через npm run dev
  
  # Traefik как reverse proxy с Authentik forward auth
  traefik:
    image: traefik:v2.10
    command:
      # Включаем API и dashboard
      - "--api.insecure=true"
      # Используем Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Используем File provider для динамической конфигурации
      - "--providers.file.filename=/etc/traefik/dynamic-config.yml"
      - "--providers.file.watch=true"
      # Настройка entrypoints
      - "--entrypoints.web.address=:80"
      # Логирование
      - "--log.level=DEBUG"
      - "--accesslog=true"
    ports:
      - "7777:80"      # HTTP порт для доступа к приложениям
      - "7778:8080"    # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic-config.yml:/etc/traefik/dynamic-config.yml:ro
    depends_on:
      - authentik_server
    networks:
      - default

volumes:
  authentik_media:
    driver: local
  authentik_templates:
    driver: local
