# Конфигурация pytest для E2E тестов
[pytest]
# Директория с тестами
testpaths = tests

# Паттерн для поиска тестовых файлов
python_files = test_*.py

# Паттерн для поиска тестовых классов
python_classes = Test*

# Паттерн для поиска тестовых функций
python_functions = test_*

# Опции вывода
addopts = 
    # Показывать детальный вывод
    -v
    # Показывать локальные переменные при ошибках
    -l
    # Показывать summary информацию
    -ra
    # Показывать print() в консоли
    -s
    # Останавливать на первой ошибке (можно убрать для прогона всех тестов)
    # -x
    # Показывать traceback в коротком формате
    --tb=short
    # Цветной вывод
    --color=yes

# Маркеры для категоризации тестов
markers =
    e2e: End-to-End тесты
    auth: Тесты авторизации
    frontend: Тесты фронтенда
    backend: Тесты бэкенда
    slow: Медленные тесты

# Минимальная версия pytest
minversion = 8.0

# Игнорировать предупреждения
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
